services:
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs
    ports:
      - "${SEAWEED_PORT}:9000"
      - "${SEAWEED_CONSOLE_PORT}:8888"
    volumes:
      - seaweed_data:/data   
    command: >
      server
      -dir=/data
      -s3
      -s3.port=9000
      -master.port=9333
      -volume.port=8080
      -filer
      -filer.port=8888

  postgres:
    image: postgres:16-alpine
    container_name: community_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    image: community-backend
    restart: unless-stopped
    ports:
      - "${API_PORT}:${API_PORT}"
    depends_on:
      seaweedfs:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - S3_ENDPOINT=http://seaweedfs:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET}
    env_file:
      - ./.env
    volumes:
      - ./backend/app:/app/app

    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "${API_PORT}", "--reload"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${API_PORT}/health"]
      interval: 35s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
    image: community-frontend
    restart: unless-stopped
    ports:
      - "${UI_PORT}:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_API_BASE_URL=http://localhost:${API_PORT}
    volumes:
      - ./frontend/src:/app/src

volumes:
  postgres_data:
  seaweed_data: